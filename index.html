<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pohon Kemiri AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>

    <style>
    html, body { 
        margin: 0; 
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden; 
        background-color: transparent;
    }
    #startBtn {
        z-index: 999;
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 20px;
        font-size: 18px;
        background: green;
        color: white;
        border-radius: 10px;
        border: none;
        cursor: pointer;
    }
    </style>

</head>
<body>
    
    <button id="startBtn">Cerita</button>

    <div id="infoCard" style="display: none; position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 80%; max-width: 300px; background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 999; text-align: center; font-family: sans-serif;">
        <h3 style="margin-top: 0; color: #2e7d32;">Pohon Kemiri</h3>
        <p id="ceritaTeks">Pohon kemiri adalah tanaman yang banyak ditemukan di Indonesia dan memiliki segudang manfaat.</p>
        <button id="closeBtn" style="margin-top: 10px; padding: 8px 15px; background: #d32f2f; color: white; border: none; border-radius: 5px;">Tutup</button>
    </div>

    <a-scene
    mindar-image="imageTargetSrc: ./marker_kemiri.mind; autoStart: true;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="treeModel" src="3d_Pohon_Hijau.glb"></a-asset-item>
        </a-assets>

        <a-camera look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#treeModel" scale="0.5 0.5 0.5"></a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const startBtn = document.getElementById("startBtn");
        const infoCard = document.getElementById("infoCard");
        const closeBtn = document.getElementById("closeBtn");

        // Munculkan kartu saat tombol Mulai Cerita diklik
        startBtn.onclick = function() {
            infoCard.style.display = "block";
            startBtn.style.display = "none"; // Sembunyikan tombol mulai
        }

        // Tutup kartu saat tombol Tutup diklik
        closeBtn.onclick = function() {
            infoCard.style.display = "none";
            startBtn.style.display = "block"; // Munculkan tombol mulai lagi
        }
    </script>

</body>
</html>
